[project]
name = "lazarus"
version = "0.1.0"
description = "Lazarus: AI DNA archivist for regulated enterprises"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "rapidfuzz>=3.6",
    "torch>=2.3",
    "deepagents>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=4",
    "langgraph>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "zstandard>=0.22",
    "python-dotenv>=1.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8"]
cloud-setup = ["psycopg[binary]>=3.2"]

[project.scripts]
lazarus-cloud = "lazarus.cloud_cli:main"
lazarus-decode = "lazarus.offline_decode:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lazarus", "dna_codec"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "profiles"
"checkpoints" = "checkpoints"

[tool.pytest.ini_options]
testpaths = ["tests"]
