[project]
name = "lazarus"
version = "0.1.0"
description = "Lazarus: AI DNA archivist for regulated enterprises, built on the Erbgut codec"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dnacodec[train]",
    "deepagents>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=4",
    "langgraph>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "zstandard>=0.22",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
dnacodec = { path = "../vendor/hackmit2026-main", editable = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lazarus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
